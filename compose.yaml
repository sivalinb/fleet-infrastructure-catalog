name: fleet-infrastructure-catalog
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-catalog-only}
      POSTGRES_DB: catalog
    volumes: [catalog-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U catalog]
      interval: 3s
      retries: 20
  api:
    build: .
    command: [python, -m, uvicorn, 'fleet_catalog.api:app_factory', --factory, --host, 0.0.0.0, --port, '8002']
    environment:
      DATABASE_URL: postgresql+psycopg://catalog:${POSTGRES_PASSWORD:-local-catalog-only}@postgres/catalog
      CATALOG_API_TOKEN: ${CATALOG_API_TOKEN:-}
    ports: ['127.0.0.1:8002:8002']
    depends_on:
      postgres: {condition: service_healthy}
  ui:
    build: .
    environment:
      CATALOG_API_URL: http://api:8002
      CATALOG_API_TOKEN: ${CATALOG_API_TOKEN:-}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: '7861'
    ports: ['127.0.0.1:7861:7861']
    depends_on: [api]
volumes:
  catalog-data:
